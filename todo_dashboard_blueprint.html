<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人任務與專案智慧導航站</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f4f6f9; color: #333333; margin: 0; padding: 20px; line-height: 1.4;
        }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; }
        .header-bar {
            background-color: #ffffff; border: 2px solid #111827; border-radius: 12px;
            padding: 15px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .header-title h1 { font-size: 20px; margin: 0; color: #111827; }
        .header-subtitle { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .btn-sync {
            background-color: #15803d; color: white; border: none; padding: 10px 20px;
            border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-sync:hover { background-color: #166534; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
        .panel-card {
            background-color: #ffffff; border: 2px solid #111827; border-radius: 12px;
            padding: 20px; position: relative; min-height: 250px;
        }
        .panel-badge {
            position: absolute; top: -12px; left: 15px; background-color: #111827;
            color: #ffffff; font-size: 11px; font-weight: bold; padding: 2px 10px; border-radius: 20px;
        }
        .panel-title { font-size: 16px; font-weight: bold; margin-top: 5px; margin-bottom: 15px; border-bottom: 1px dashed #d1d5db; padding-bottom: 8px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 12px; }
        label { font-size: 13px; font-weight: bold; color: #374151; display: block; margin-bottom: 4px; }
        input[type="text"], input[type="date"], select {
            width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background-color: #f8fafc;
        }
        input:focus, select:focus { border-color: #111827; outline: none; background-color: #ffffff; }
        .btn-submit {
            background-color: #111827; color: #ffffff; border: none; width: 100%; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 5px;
        }
        .btn-submit:hover { background-color: #1f2937; }
        .urgent-item { background-color: #fff1f2; border-left: 4px solid #f43f5e; padding: 10px; border-radius: 4px; margin-bottom: 10px; font-size: 13px; }
        .urgent-meta { font-size: 11px; color: #e11d48; font-weight: bold; margin-bottom: 2px; }
        .no-data { color: #9ca3af; text-align: center; padding: 20px; font-size: 14px; }
        .calendar-table { width: 100%; border-collapse: collapse; }
        .calendar-table th { background-color: #f1f5f9; color: #475569; font-size: 12px; padding: 6px; border: 1px solid #e2e8f0; }
        .calendar-table td { border: 1px solid #e2e8f0; width: 14.28%; height: 60px; vertical-align: top; padding: 4px; font-size: 11px; background-color: #ffffff; }
        .calendar-table td.today { background-color: #f0fdf4; border: 2px solid #16a34a; }
        .calendar-day-num { font-weight: bold; color: #64748b; margin-bottom: 2px; display: block; }
        .calendar-tag { background-color: #3b82f6; color: white; font-size: 10px; padding: 1px 4px; border-radius: 3px; display: block; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .data-panel { background-color: #ffffff; border: 2px solid #111827; border-radius: 12px; padding: 20px; }
        .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .filter-left { font-size: 16px; font-weight: bold; }
        .inline-select { width: auto; display: inline-block; padding: 4px 10px; font-size: 13px; margin-left: 5px; }
        .todo-table { width: 100%; border-collapse: collapse; }
        .todo-table th { background-color: #1e293b; color: #ffffff; padding: 10px; text-align: left; font-size: 14px; }
        .todo-table td { padding: 10px; font-size: 14px; border-bottom: 1px solid #e2e8f0; }
        .todo-table tr:hover td { background-color: #f8fafc; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .status-未開始 { background-color: #fef3c7; color: #d97706; }
        .status-進行中 { background-color: #dbeafe; color: #2563eb; }
        .status-已完成 { background-color: #dcfce7; color: #16a34a; }
        .btn-delete { background: none; border: none; cursor: pointer; color: #ef4444; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <div class="header-title">
            <h1>📋 全家人智慧任務與專案導航站</h1>
            <div class="header-subtitle">Task & Project Intelligence Cloud Portal</div>
        </div>
        <div>
            <button class="btn-sync" onclick="syncToGoogleSheets()">🔄 同步至 Google Sheets 備份</button>
        </div>
    </div>

    <div class="main-grid">
        <div class="panel-card">
            <span class="panel-badge">00 智慧急件解析</span>
            <h2 class="panel-title">🔔 近期一週截止內提醒 (7天內急件)</h2>
            <div id="urgent-container"></div>
        </div>

        <div class="panel-card">
            <span class="panel-badge">01 手動記錄 / 新增區</span>
            <h2 class="panel-title">✏️ 新增待辦事件與專案項目</h2>
            
            <div class="form-row">
                <div>
                    <label>大項目分類</label>
                    <select id="task-category">
                        <option value="💼 財務投資">💼 財務投資</option>
                        <option value="📊 公司稅務">📊 公司稅務</option>
                        <option value="🏠 家用日常">🏠 家用日常</option>
                        <option value="🍎 健康管理">🍎 健康管理</option>
                        <option value="🎮 復古電玩">🎮 復古電玩</option>
                    </select>
                </div>
                <div>
                    <label>事件名稱 / 待辦內容</label>
                    <input type="text" id="task-name" placeholder="例如：申報營業稅...">
                </div>
                <div>
                    <label>負責對象</label>
                    <select id="task-owner">
                        <option value="妃">妃</option>
                        <option value="通">通</option>
                        <option value="全家">全家</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label>截止日期</label>
                    <input type="date" id="task-date">
                </div>
                <div>
                    <label>優先權</label>
                    <select id="task-priority">
                        <option value="🔴 高">🔴 高 (急)</option>
                        <option value="🟡 中">🟡 中</option>
                        <option value="🟢 低">🟢 低</option>
                    </select>
                </div>
                <div>
                    <label>目前狀態</label>
                    <select id="task-status">
                        <option value="未開始">未開始</option>
                        <option value="進行中">進行中</option>
                        <option value="已完成">已完成</option>
                    </select>
                </div>
            </div>
            <button class="btn-submit" onclick="addTask()">＋ 確認新增至任務暫存表</button>
        </div>
    </div>

    <div class="main-grid" style="grid-template-columns: 1fr;">
        <div class="panel-card" style="min-height: auto;">
            <span class="panel-badge">02 智能日曆視圖</span>
            <h2 class="panel-title">📅 截止日行事曆（今日起雙週精簡視圖）</h2>
            <table class="calendar-table">
                <thead>
                    <tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr>
                </thead>
                <tbody id="calendar-body"></tbody>
            </table>
        </div>
    </div>

    <div class="data-panel">
        <div class="filter-bar">
            <div class="filter-left">📊 03 目前所有項目清單 (本地暫存)</div>
            <div>
                <select id="filter-owner" class="inline-select" onchange="renderDashboard()">
                    <option value="全部">全部成員</option>
                    <option value="妃">妃</option>
                    <option value="通">通</option>
                </select>
            </div>
        </div>

        <table class="todo-table">
            <thead>
                <tr>
                    <th>截止日期</th>
                    <th>大項目分類</th>
                    <th>待辦事件內容</th>
                    <th>負責對象</th>
                    <th>優先權</th>
                    <th>狀態</th>
                    <th style="text-align: center;">操作</th>
                </tr>
            </thead>
            <tbody id="todo-body"></tbody>
        </table>
    </div>
</div>

<script>
    // 預設幾筆初始模擬資料
    let tasks = [
        { id: 1, date: "2026-06-01", category: "📊 公司稅務", name: "五月營業稅申報資料與憑證最終核對", owner: "妃", priority: "🔴 高", status: "進行中" },
        { id: 2, date: "2026-06-04", category: "🏠 家用日常", name: "幫媽媽訂購端午節素食粽子禮盒", owner: "妃", priority: "🟡 中", status: "未開始" },
        { id: 3, date: "2026-06-05", category: "💼 財務投資", name: "美股 Firstrade 帳戶定期定額 VOO / QQQ 資金匯入確認", owner: "妃", priority: "🟡 中", status: "未開始" }
    ];

    // 設定預設日期為今天
    document.getElementById('task-date').value = new Date().toISOString().split('T')[0];

    // 初始化渲染
    renderDashboard();

    // 新增項目函數
    function addTask() {
        const category = document.getElementById('task-category').value;
        const name = document.getElementById('task-name').value.trim();
        const owner = document.getElementById('task-owner').value;
        const date = document.getElementById('task-date').value;
        const priority = document.getElementById('task-priority').value;
        const status = document.getElementById('task-status').value;

        if (!name) { alert('請輸入事件名稱內容！'); return; }
        if (!date) { alert('請選擇截止日期！'); return; }

        const newTask = { id: Date.now(), date, category, name, owner, priority, status };
        tasks.push(newTask);
        
        // 清空輸入框並重新渲染
        document.getElementById('task-name').value = '';
        renderDashboard();
    }

    // 刪除項目函數
    function deleteTask(id) {
        if(confirm('確定要刪除此項待辦嗎？')) {
            tasks = tasks.filter(task => task.id !== id);
            renderDashboard();
        }
    }

    // 核心渲染主程式
    function renderDashboard() {
        const filterOwner = document.getElementById('filter-owner').value;
        const today = new Date();
        today.setHours(0,0,0,0);

        // 篩選資料
        const filteredTasks = tasks.filter(t => filterOwner === '全部' || t.owner === filterOwner);

        // 1. 渲染第 3 區：所有項目清單
        const todoBody = document.getElementById('todo-body');
        todoBody.innerHTML = '';
        if(filteredTasks.length === 0) {
            todoBody.innerHTML = `<tr><td colspan="7" class="no-data">目前沒有待辦項目</td></tr>`;
        } else {
            // 依日期排序
            filteredTasks.sort((a,b) => new Date(a.date) - new Date(b.date));
            filteredTasks.forEach(t => {
                todoBody.innerHTML += `
                    <tr>
                        <td><strong>${t.date.replace(/-/g, '/')}</strong></td>
                        <td>${t.category}</td>
                        <td>${t.name}</td>
                        <td>${t.owner}</td>
                        <td style="font-weight:bold;">${t.priority}</td>
                        <td><span class="status-badge status-${t.status}">${t.status}</span></td>
                        <td style="text-align:center;"><button class="btn-delete" onclick="deleteTask(${t.id})">🗑️</button></td>
                    </tr>
                `;
            });
        }

        // 2. 渲染第 0 區：一週內急件解析 (7天內且未完成)
        const urgentContainer = document.getElementById('urgent-container');
        urgentContainer.innerHTML = '';
        const urgentTasks = tasks.filter(t => {
            const diffTime = new Date(t.date) - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays >= 0 && diffDays <= 7 && t.status !== '已完成';
        });

        if(urgentTasks.length === 0) {
            urgentContainer.innerHTML = `<div class="no-data">☕ 太棒了！目前一週內沒有緊迫的未完成事件。</div>`;
        } else {
            urgentTasks.forEach(t => {
                const diffDays = Math.ceil((new Date(t.date) - today) / (1000 * 60 * 60 * 24));
                urgentContainer.innerHTML += `
                    <div class="urgent-item">
                        <div class="urgent-meta">⚠️ 剩餘 ${diffDays} 天 | 截止日: ${t.date.replace(/-/g, '/')}</div>
                        <strong>【${t.category}】</strong> ${t.name} (${t.owner})
                    </div>
                `;
            });
        }

        // 3. 渲染第 2 區：動態雙週日曆
        renderCalendar(today);
    }

    // 日曆生成器（動態抓取今日起14天）
    function renderCalendar(today) {
        const calendarBody = document.getElementById('calendar-body');
        calendarBody.innerHTML = '';
        
        // 找出今日那週的禮拜天作為起點
        let startGrid = new Date(today);
        startGrid.setDate(today.getDate() - today.getDay());

        // 繪製兩週（14格）
        let html = '<tr>';
        for (let i = 0; i < 14; i++) {
            if (i > 0 && i % 7 === 0) html += '</tr><tr>';
            
            let currentGridDate = new Date(startGrid);
            currentGridDate.setDate(startGrid.getDate() + i);
            let dateStr = currentGridDate.toISOString().split('T')[0];

            let isToday = dateStr === today.toISOString().split('T')[0] ? 'class="today"' : '';
            let dayDisplay = currentGridDate.getDate();
            if(dateStr === today.toISOString().split('T')[0]) dayDisplay += ' (今)';

            // 找出這一天截止的任務
            let dayTasks = tasks.filter(t => t.date === dateStr);
            let tagsHtml = '';
            dayTasks.forEach(t => {
                tagsHtml += `<span class="calendar-tag" title="${t.name}">${t.name}</span>`;
            });

            html += `<td ${isToday}><span class="calendar-day-num">${dayDisplay}</span>${tagsHtml}</td>`;
        }
        html += '</tr>';
        calendarBody.innerHTML = html;
    }

    // 連接 Google Sheets 提示
    function syncToGoogleSheets() {
        alert('本地資料處理成功！\n提示：要正式將資料寫入雲端 Excel，需要為您產生一組專屬的 Google Apps Script (GAS) 部署網址，並貼入本網頁中。需要現在幫您產生這段後端連線碼嗎？');
    }
</script>

</body>
</html>
