<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人任務與專案智慧導航站</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f4f6f9; color: #333333; margin: 0; padding: 20px; line-height: 1.4;
        }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; }
        .header-bar {
            background-color: #ffffff; border: 2px solid #111827; border-radius: 12px;
            padding: 15px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px;
        }
        .header-title h1 { font-size: 20px; margin: 0; color: #111827; }
        .header-subtitle { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .header-buttons { display: flex; gap: 10px; }
        .btn-sync {
            background-color: #15803d; color: white; border: none; padding: 10px 20px;
            border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-sync:hover { background-color: #166534; }
        .btn-settings {
            background-color: #4b5563; color: white; border: none; padding: 10px 20px;
            border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-settings:hover { background-color: #374151; }
        
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel-card {
            background-color: #ffffff; border: 2px solid #111827; border-radius: 12px;
            padding: 20px; position: relative; min-height: 250px;
        }
        .panel-badge {
            position: absolute; top: -12px; left: 15px; background-color: #111827;
            color: #ffffff; font-size: 11px; font-weight: bold; padding: 2px 10px; border-radius: 20px;
        }
        .panel-title { font-size: 16px; font-weight: bold; margin-top: 5px; margin-bottom: 15px; border-bottom: 1px dashed #d1d5db; padding-bottom: 8px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 12px; }
        label { font-size: 13px; font-weight: bold; color: #374151; display: block; margin-bottom: 4px; }
        input[type="text"], input[type="date"], select {
            width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; background-color: #f8fafc;
        }
        input:focus, select:focus { border-color: #111827; outline: none; background-color: #ffffff; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; border: 2px solid #111827; width: 90%; max-width: 500px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }

        .btn-submit { background-color: #111827; color: #ffffff; border: none; width: 100%; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-submit:hover { background-color: #1f2937; }
        .urgent-item { background-color: #fff1f2; border-left: 4px solid #f43f5e; padding: 10px; border-radius: 4px; margin-bottom: 10px; font-size: 13px; }
        .urgent-meta { font-size: 11px; color: #e11d48; font-weight: bold; margin-bottom: 2px; }
        .no-data { color: #9ca3af; text-align: center; padding: 20px; font-size: 14px; }
        
        /* 📅 日曆視圖基礎與橘黃色系美化 */
        .calendar-table { width: 100%; border-collapse: collapse; }
        .calendar-table th { background-color: #fdf6ed; color: #b45309; font-size: 13px; font-weight: bold; padding: 8px 6px; border: 1px solid #fed7aa; }
        .calendar-table td { border: 1px solid #e2e8f0; width: 14.28%; height: 75px; vertical-align: top; padding: 6px; font-size: 13px; background-color: #ffffff; }
        
        /* 今天 (今) 橘黃色亮眼高亮 */
        .calendar-table td.today { background-color: #fef3c7; border: 2px solid #d97706; }
        .calendar-table td.today .calendar-day-num { color: #b45309; }
        
        /* 日曆數字加大、加粗、改橘色 */
        .calendar-day-num { font-size: 15px; font-weight: 900; color: #ea580c; margin-bottom: 4px; display: block; }
        .calendar-tag { background-color: #3b82f6; color: white; font-size: 10px; padding: 2px 4px; border-radius: 3px; display: block; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }
        .calendar-tag.done { background-color: #cbd5e1; color: #94a3b8; text-decoration: line-through; }
        
        .data-panel { background-color: #ffffff; border: 2px solid #111827; border-radius: 12px; padding: 20px; }
        .filter-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .filter-left { font-size: 16px; font-weight: bold; }
        .filter-controls { display: flex; gap: 8px; flex-wrap: wrap; }
        .inline-select { width: auto; display: inline-block; padding: 6px 12px; font-size: 13px; border-radius: 6px; border: 1px solid #cbd5e1; }
        
        /* 項目列表防擠壓外殼 */
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .todo-table { width: 100%; border-collapse: collapse; min-width: 750px; } /* 限制最小寬度防止手機排版被擠扁 */
        .todo-table th { background-color: #1e293b; color: #ffffff; padding: 10px; text-align: left; font-size: 14px; white-space: nowrap; }
        .todo-table td { padding: 10px; font-size: 14px; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        .todo-table tr:hover td { background-color: #f8fafc; }
        
        .editable-cell { cursor: pointer; border-bottom: 1px dotted #2563eb; padding: 4px; border-radius: 4px; }
        .editable-cell:hover { background-color: #f0fdf4; color: #2563eb; }
        .cell-inline-input { width: 100%; padding: 4px 6px; font-size: 14px; border: 1px solid #2563eb; border-radius: 4px; background-color: #fff; }

        .row-done { color: #94a3b8; background-color: #f8fafc; }
        .row-done .task-text { text-decoration: line-through; border-bottom: none; }
        .row-done .editable-cell { border-bottom: none; }
        
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .status-未開始 { background-color: #fef3c7; color: #d97706; }
        .status-進行中 { background-color: #dbeafe; color: #2563eb; }
        .status-已完成 { background-color: #dcfce7; color: #16a34a; }
        
        .btn-delete { background: none; border: none; cursor: pointer; color: #ef4444; font-size: 16px; }
        .chk-box { width: 16px; height: 16px; cursor: pointer; }
        
        .loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.7); z-index:9999; justify-content:center; align-items:center; font-size:18px; font-weight:bold; color:#111827; }

        /* 📱 專屬手機版行動裝置最佳化排版 (不影響電腦版) */
        @media (max-width: 768px) {
            body { padding: 10px; }
            .main-grid { grid-template-columns: 1fr; gap: 15px; } /* 手機版上下堆疊 */
            .header-bar { padding: 12px; text-align: center; justify-content: center; }
            .header-buttons { width: 100%; justify-content: center; }
            .btn-sync, .btn-settings { flex: 1; text-align: center; font-size: 13px; padding: 8px 12px; }
            
            /* 手機版篩選控制列改為二字並排，整齊不飄移 */
            .filter-bar { flex-direction: column; align-items: flex-start; }
            .filter-controls { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .inline-select { width: 100%; }

            /* 手機版日曆微調高寬度 */
            .calendar-table td { height: 65px; padding: 4px; font-size: 11px; }
            .calendar-day-num { font-size: 13px; }
        }
    </style>
</head>
<body>

<div id="loading-mask" class="loading-overlay">⏳ 雲端資料同步中，請稍候...</div>

<div class="container">
    <div class="header-bar">
        <div class="header-title">
            <h1>📋 全家人智慧任務與專案導航站</h1>
            <div class="header-subtitle">Task & Project Intelligence Cloud Portal</div>
        </div>
        <div class="header-buttons">
            <button class="btn-settings" onclick="toggleModal(true)">⚙️ 自訂選單設定</button>
            <button class="btn-sync" onclick="syncToGoogleSheets()">💾 儲存並同步至雲端</button>
        </div>
    </div>

    <div class="main-grid">
        <div class="panel-card">
            <span class="panel-badge">00 智慧急件解析</span>
            <h2 class="panel-title">🔔 近期一週截止內提醒 (7天內未完成急件)</h2>
            <div id="urgent-container"></div>
        </div>

        <div class="panel-card">
            <span class="panel-badge">01 手動記錄 / 新增區</span>
            <h2 class="panel-title">✏️ 新增待辦事件與專案項目</h2>
            
            <div class="form-row">
                <div>
                    <label>大項目分類</label>
                    <select id="task-category"></select>
                </div>
                <div>
                    <label>事件名稱 / 待辦內容</label>
                    <input type="text" id="task-name" placeholder="例如：申報營業稅...">
                </div>
                <div>
                    <label>負責對象</label>
                    <select id="task-owner"></select>
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label>截止日期</label>
                    <input type="date" id="task-date">
                </div>
                <div>
                    <label>優先權</label>
                    <select id="task-priority">
                        <option value="🔴 高">🔴 高 (急)</option>
                        <option value="🟡 中">🟡 中</option>
                        <option value="🟢 低">🟢 低</option>
                    </select>
                </div>
                <div>
                    <label>目前狀態</label>
                    <select id="task-status">
                        <option value="未開始">未開始</option>
                        <option value="進行中">進行中</option>
                        <option value="已完成">已完成</option>
                    </select>
                </div>
            </div>
            <button class="btn-submit" onclick="addTask()">＋ 確認新增至任務暫存表</button>
        </div>
    </div>

    <div class="main-grid" style="grid-template-columns: 1fr;">
        <div class="panel-card" style="min-height: auto;">
            <span class="panel-badge">02 智能日曆視圖</span>
            <h2 class="panel-title">📅 截止日行事曆（今日起雙週精簡視圖）</h2>
            <div style="width: 100%; overflow-x: auto;">
                <table class="calendar-table">
                    <thead>
                        <tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr>
                    </thead>
                    <tbody id="calendar-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="data-panel">
        <div class="filter-bar">
            <div class="filter-left">📊 03 目前所有項目清單 <span style="font-size:11px; font-weight:normal; color:#6b7280;">(修改後請記得點右上角「儲存並同步至雲端」)</span></div>
            <div class="filter-controls">
                <select id="filter-owner" class="inline-select" onchange="renderDashboard()">
                    <option value="全部">👥 全部成員</option>
                </select>
                <select id="filter-month" class="inline-select" onchange="renderDashboard()">
                    <option value="全部">📅 全部月份</option>
                </select>
                <select id="filter-category" class="inline-select" onchange="renderDashboard()">
                    <option value="全部">🏷️ 全部分類</option>
                </select>
                <select id="filter-status" class="inline-select" onchange="renderDashboard()">
                    <option value="全部">🔍 全部狀態</option>
                    <option value="未完成">⏳ 未完成</option>
                    <option value="已完成">✅ 已完成</option>
                </select>
            </div>
        </div>

        <div class="table-responsive">
            <table class="todo-table">
                <thead>
                    <tr>
                        <th style="width: 5%; text-align: center;">紀錄</th>
                        <th style="width: 14%;">截止日期</th>
                        <th style="width: 16%;">大項目分類</th>
                        <th style="width: 32%;">待辦事件內容 (點擊可改)</th>
                        <th style="width: 10%;">負責</th>
                        <th style="width: 8%;">優先權</th>
                        <th style="width: 10%;">狀態</th>
                        <th style="width: 5%; text-align: center;">操作</th>
                    </tr>
                </thead>
                <tbody id="todo-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0;">⚙️ 自訂選單項目設定</h3>
        <p style="font-size:12px; color:#6b7280;">請用「中文半形逗號 ,」分隔各個項目</p>
        
        <div style="margin-bottom:12px;">
            <label>家庭成員列表</label>
            <input type="text" id="setting-owners" value="妃,通,爸爸,媽媽,全家">
        </div>
        <div style="margin-bottom:12px;">
            <label>大項目分類列表</label>
            <input type="text" id="setting-categories" value="💼 財務投資,📊 公司稅務,🏠 家用日常,🍎 健康管理,🎮 復古電玩">
        </div>
        
        <div class="modal-buttons">
            <button class="btn-settings" style="background:#9ca3af;" onclick="toggleModal(false)">取消</button>
            <button class="btn-sync" onclick="saveSettings()">儲存自訂選單</button>
        </div>
    </div>
</div>

<script>
    // 📢 您的專屬獨立 Web App 網址
    const API_URL = "https://script.google.com/macros/s/AKfycbwWgfzw6d_Kk5osOblW1_azjz4sDelYnTj6ilTu9y1sxi6kVF_2MVOby9h7ndJQ47K80Q/exec";

    let config = { owners: ["妃", "通", "爸爸", "媽媽", "全家"], categories: ["💼 財務投資", "📊 公司稅務", "🏠 家用日常", "🍎 健康管理", "🎮 復古電玩"] };
    let tasks = [];

    document.getElementById('task-date').value = new Date().toISOString().split('T')[0];

    window.onload = function() {
        loadDataFromGoogleSheets();
    };

    function loadDataFromGoogleSheets() {
        if(!API_URL || API_URL.includes("您的全新_Google")) {
            applyConfigUI();
            updateMonthFilterOptions();
            renderDashboard();
            return;
        }
        
        document.getElementById('loading-mask').style.display = 'flex';
        
        fetch(API_URL)
        .then(res => res.json())
        .then(resData => {
            if(resData) {
                if(resData.config) {
                    config = resData.config;
                    document.getElementById('setting-owners').value = config.owners.join(',');
                    document.getElementById('setting-categories').value = config.categories.join(',');
                }
                if(resData.tasks) {
                    tasks = resData.tasks;
                }
            }
            applyConfigUI();
            updateMonthFilterOptions();
            renderDashboard();
        })
        .catch(err => {
            console.error("載入失敗：", err);
            alert("載入雲端資料時發生錯誤。");
            applyConfigUI();
            updateMonthFilterOptions();
            renderDashboard();
        })
        .finally(() => {
            document.getElementById('loading-mask').style.display = 'none';
        });
    }

    function syncToGoogleSheets() {
        if(!API_URL || API_URL.includes("您的全新_Google")) {
            alert("請先填入您的全新 Google Apps Script Web App 網址！");
            return;
        }
        
        document.getElementById('loading-mask').style.display = 'flex';
        
        const payload = {
            tasks: tasks,
            config: config
        };
        
        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.text())
        .then(text => {
            if(text === "Success") {
                alert("🎉 所有待辦事項與自訂選單設定已成功同步至雲端試算表！");
            } else {
                alert("回傳回應：" + text);
            }
        })
        .catch(err => {
            console.error("儲存失敗：", err);
            alert("同步至雲端時發生錯誤！");
        })
        .finally(() => {
            document.getElementById('loading-mask').style.display = 'none';
        });
    }

    function toggleModal(show) {
        document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
    }

    function saveSettings() {
        const oInput = document.getElementById('setting-owners').value;
        const cInput = document.getElementById('setting-categories').value;
        config.owners = oInput.split(',').map(s => s.trim()).filter(s => s);
        config.categories = cInput.split(',').map(s => s.trim()).filter(s => s);
        applyConfigUI();
        toggleModal(false);
        renderDashboard();
    }

    function applyConfigUI() {
        document.getElementById('task-category').innerHTML = config.categories.map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('task-owner').innerHTML = config.owners.map(o => `<option value="${o}">${o}</option>`).join('');
        
        const filterOwner = document.getElementById('filter-owner');
        const currentOwnerVal = filterOwner.value;
        filterOwner.innerHTML = '<option value="全部">👥 全部成員</option>' + config.owners.map(o => `<option value="${o}">${o}</option>`).join('');
        filterOwner.value = currentOwnerVal;
        if (filterOwner.selectedIndex === -1) filterOwner.value = "全部";

        const filterCat = document.getElementById('filter-category');
        const currentCatVal = filterCat.value;
        filterCat.innerHTML = '<option value="全部">🏷️ 全部分類</option>' + config.categories.map(c => `<option value="${c}">${c}</option>`).join('');
        filterCat.value = currentCatVal;
        if (filterCat.selectedIndex === -1) filterCat.value = "全部";
    }

    function updateMonthFilterOptions() {
        const monthSelect = document.getElementById('filter-month');
        const savedValue = monthSelect.value;
        monthSelect.innerHTML = '<option value="全部">📅 全部月份</option>';
        const months = [];
        tasks.forEach(t => {
            if(t.date) {
                const ym = t.date.substring(0, 7);
                if(!months.includes(ym)) months.push(ym);
            }
        });
        months.sort();
        months.forEach(ym => {
            const [year, month] = ym.split('-');
            monthSelect.innerHTML += `<option value="${ym}">${year}年 ${month}月</option>`;
        });
        monthSelect.value = savedValue;
        if(monthSelect.selectedIndex === -1) monthSelect.value = "全部";
    }

    function addTask() {
        const category = document.getElementById('task-category').value;
        const name = document.getElementById('task-name').value.trim();
        const owner = document.getElementById('task-owner').value;
        const date = document.getElementById('task-date').value;
        const priority = document.getElementById('task-priority').value;
        const status = document.getElementById('task-status').value;

        if (!name) { alert('請輸入事件名稱內容！'); return; }
        if (!date) { alert('請選擇截止日期！'); return; }

        const newTask = { id: Date.now(), date, category, name, owner, priority, status };
        tasks.push(newTask);
        document.getElementById('task-name').value = '';
        updateMonthFilterOptions();
        renderDashboard();
    }

    function startEditName(id, currentText, cellElement) {
        if (cellElement.querySelector('input, select')) return;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'cell-inline-input';
        input.value = currentText;
        cellElement.innerHTML = '';
        cellElement.appendChild(input);
        input.focus();
        function finishEdit() {
            const newText = input.value.trim() || currentText;
            tasks = tasks.map(t => { if (t.id === id) t.name = newText; return t; });
            renderDashboard();
        }
        input.onblur = finishEdit;
        input.onkeydown = function(e) { if(e.key === 'Enter') finishEdit(); };
    }

    function startEditDate(id, currentDate, cellElement) {
        if (cellElement.querySelector('input, select')) return;
        const input = document.createElement('input');
        input.type = 'date';
        input.className = 'cell-inline-input';
        input.value = currentDate;
        cellElement.innerHTML = '';
        cellElement.appendChild(input);
        input.focus();
        function finishEdit() {
            const newDate = input.value || currentDate;
            tasks = tasks.map(t => { if (t.id === id) t.date = newDate; return t; });
            updateMonthFilterOptions();
            renderDashboard();
        }
        input.onblur = finishEdit;
        input.onkeydown = function(e) { if(e.key === 'Enter') finishEdit(); };
    }

    function startEditCategory(id, currentCategory, cellElement) {
        if (cellElement.querySelector('input, select')) return;
        const select = document.createElement('select');
        select.className = 'cell-inline-input';
        config.categories.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c; opt.textContent = c;
            if (c === currentCategory) opt.selected = true;
            select.appendChild(opt);
        });
        cellElement.innerHTML = '';
        cellElement.appendChild(select);
        select.focus();
        function finishEdit() {
            const newCat = select.value;
            tasks = tasks.map(t => { if (t.id === id) t.category = newCat; return t; });
            renderDashboard();
        }
        select.onblur = finishEdit;
        select.onchange = finishEdit;
    }

    function startEditOwner(id, currentOwner, cellElement) {
        if (cellElement.querySelector('input, select')) return;
        const select = document.createElement('select');
        select.className = 'cell-inline-input';
        config.owners.forEach(o => {
            const opt = document.createElement('option');
            opt.value = o; opt.textContent = o;
            if (o === currentOwner) opt.selected = true;
            select.appendChild(opt);
        });
        cellElement.innerHTML = '';
        cellElement.appendChild(select);
        select.focus();
        function finishEdit() {
            const newOwner = select.value;
            tasks = tasks.map(t => { if (t.id === id) t.owner = newOwner; return t; });
            renderDashboard();
        }
        select.onblur = finishEdit;
        select.onchange = finishEdit;
    }

    function toggleTaskStatus(id, isChecked) {
        tasks = tasks.map(t => {
            if (t.id === id) t.status = isChecked ? '已完成' : '進行中';
            return t;
        });
        renderDashboard();
    }

    function deleteTask(id) {
        if(confirm('確定要刪除此項待辦嗎？')) {
            tasks = tasks.filter(task => task.id !== id);
            updateMonthFilterOptions();
            renderDashboard();
        }
    }

    function renderDashboard() {
        const filterOwner = document.getElementById('filter-owner').value;
        const filterMonth = document.getElementById('filter-month').value;
        const filterCategory = document.getElementById('filter-category').value;
        const filterStatus = document.getElementById('filter-status').value;
        const today = new Date();
        today.setHours(0,0,0,0);

        const filteredTasks = tasks.filter(t => {
            const matchOwner = (filterOwner === '全部' || t.owner === filterOwner);
            const matchMonth = (filterMonth === '全部' || t.date.startsWith(filterMonth));
            const matchCategory = (filterCategory === '全部' || t.category === filterCategory);
            let matchStatus = true;
            if (filterStatus === '未完成') matchStatus = (t.status !== '已完成');
            else if (filterStatus === '已完成') matchStatus = (t.status === '已完成');
            return matchOwner && matchMonth && matchCategory && matchStatus;
        });

        const todoBody = document.getElementById('todo-body');
        todoBody.innerHTML = '';
        if(filteredTasks.length === 0) {
            todoBody.innerHTML = `<tr><td colspan="8" class="no-data">沒有符合篩選條件的項目</td></tr>`;
        } else {
            filteredTasks.sort((a,b) => new Date(a.date) - new Date(b.date));
            filteredTasks.forEach(t => {
                const isDone = t.status === '已完成';
                const rowClass = isDone ? 'class="row-done"' : '';
                const chkAttribute = isDone ? 'checked' : '';
                const nameStyle = isDone ? 'task-text' : 'task-text editable-cell';
                const cellStyle = isDone ? '' : 'editable-cell';

                todoBody.innerHTML += `
                    <tr ${rowClass}>
                        <td style="text-align:center;"><input type="checkbox" class="chk-box" onchange="toggleTaskStatus(${t.id}, this.checked)" ${chkAttribute}></td>
                        <td onclick="${isDone ? '' : `startEditDate(${t.id}, '${t.date}', this)`}"><span class="${cellStyle}"><strong>${t.date.replace(/-/g, '/')}</strong></span></td>
                        <td onclick="${isDone ? '' : `startEditCategory(${t.id}, '${t.category}', this)`}"><span class="${cellStyle}">${t.category}</span></td>
                        <td onclick="${isDone ? '' : `startEditName(${t.id}, '${t.name.replace(/'/g, "\\'")}', this)`}"><span class="${nameStyle}">${t.name}</span></td>
                        <td onclick="${isDone ? '' : `startEditOwner(${t.id}, '${t.owner}', this)`}"><span class="${cellStyle}">${t.owner}</span></td>
                        <td style="font-weight:bold;">${t.priority}</td>
                        <td><span class="status-badge status-${t.status}">${t.status}</span></td>
                        <td style="text-align:center;"><button class="btn-delete" onclick="deleteTask(${t.id})">🗑️</button></td>
                    </tr>
                `;
            });
        }

        const urgentContainer = document.getElementById('urgent-container');
        urgentContainer.innerHTML = '';
        const urgentTasks = tasks.filter(t => {
            const diffTime = new Date(t.date) - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays >= 0 && diffDays <= 7 && t.status !== '已完成';
        });
        if(urgentTasks.length === 0) {
            urgentContainer.innerHTML = `<div class="no-data">☕ 太棒了！目前一週內沒有緊迫的未完成事件。</div>`;
        } else {
            urgentTasks.forEach(t => {
                const diffDays = Math.ceil((new Date(t.date) - today) / (1000 * 60 * 60 * 24));
                urgentContainer.innerHTML += `
                    <div class="urgent-item">
                        <div class="urgent-meta">⚠️ 剩餘 ${diffDays} 天 | 截止日: ${t.date.replace(/-/g, '/')}</div>
                        <strong>【${t.category}】</strong> ${t.name} (${t.owner})
                    </div>
                `;
            });
        }
        renderCalendar(today);
    }

    function renderCalendar(today) {
        const calendarBody = document.getElementById('calendar-body');
        calendarBody.innerHTML = '';
        let startGrid = new Date(today);
        startGrid.setDate(today.getDate() - today.getDay());
        let html = '<tr>';
        for (let i = 0; i < 14; i++) {
            if (i > 0 && i % 7 === 0) html += '</tr><tr>';
            let currentGridDate = new Date(startGrid);
            currentGridDate.setDate(startGrid.getDate() + i);
            let dateStr = currentGridDate.toISOString().split('T')[0];
            let isToday = dateStr === today.toISOString().split('T')[0] ? 'class="today"' : '';
            let dayDisplay = currentGridDate.getDate();
            if(dateStr === today.toISOString().split('T')[0]) dayDisplay += ' (今)';
            let dayTasks = tasks.filter(t => t.date === dateStr);
            let tagsHtml = '';
            dayTasks.forEach(t => {
                const doneClass = t.status === '已完成' ? 'done' : '';
                tagsHtml += `<span class="calendar-tag ${doneClass}" title="${t.name}">${t.name}</span>`;
            });
            html += `<td ${isToday}><span class="calendar-day-num">${dayDisplay}</span>${tagsHtml}</td>`;
        }
        html += '</tr>';
        calendarBody.innerHTML = html;
    }
</script>

</body>
</html>
